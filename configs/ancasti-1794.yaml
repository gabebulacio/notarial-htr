# Una colección = un archivo de configuración. Para un legajo nuevo, copiar este
# archivo y ajustar `collection` y `source`; el código no cambia.
collection:
  id: ancasti-1794
  title: "Informaciones matrimoniales, Ancasti (1794-1799)"
  place: "Ancasti, Catamarca"
  years: [1794, 1799]
  language: es
  record_type: informacion_matrimonial

source:
  pdf: "C:/Users/GabrielBulacio/Downloads/1794 Ancasti info mat 1794_1799 (2).pdf"

data_dir: data/ancasti-1794

preprocess:
  # Rango y paso (grados) para buscar la inclinación de los renglones
  deskew_max_angle: 4.0
  deskew_step: 0.1
  # Por debajo de esta proporción de píxeles de tinta la página se toma como en blanco
  blank_ink_ratio: 0.004
  # Ancho/alto a partir del cual la imagen se trata como doble página
  spread_aspect: 1.15
  # Contraste local (CLAHE). 0 = apagado: en estas fotos realza la textura del papel y
  # Kraken segmenta peor (más renglones partidos y ruido en los bordes)
  clahe_clip: 0
  clahe_tile: 16

layout:
  detect_paper_edges: true
  edge_frac: 0.08
  short_frac: 0.25
  merge_y_frac: 0.35
  merge_gap_frac: 0.06
  suspect_tiny_ratio: 0.5
  tiny_line_frac: 0.15

recognition:
  # McCATMuS (Chagué, CC-BY-4.0): manuscritos, impresos y mecanografiados, siglos XVI-XXI.
  # https://zenodo.org/records/13788177 · se baja con `python tasks.py models`
  model: models/base/mccatmus/McCATMuS_nfd_nofix_V1.mlmodel
  model_sha256: dfb911ba25fd11f93efc1b0c340957162981ecfdaac0ee1e26793d491f770244
  unicode_form: NFC
  low_conf: 0.8

# Correcciones humanas (versionadas en el repo)
ground_truth_dir: ground_truth/ancasti-1794

evaluation:
  # 12 páginas al azar (semilla 1794) entre las 211 con segmentación sana y 8+ renglones.
  # Se corrigen pero nunca se usan para entrenar: son la medida honesta del error.
  test_pages: [p0010, p0013, p0064, p0074, p0077, p0090, p0115, p0138, p0176, p0193, p0215, p0217]
